name: Tests (NWB interop)

# NWB (pynwb) is an optional extra. The default test job installs only the dev
# extra, so the NWB round-trip / lazy-read and component-reader tests
# would otherwise only ever be skipped. This job installs the nwb extra and runs
# the NWB tests, including operator regressions on reconstructed environments.

on:
  push:
    branches:
      - main
  # Run checks for stacked PRs as well as PRs targeting main.
  pull_request:

permissions:
  contents: read

# Only the latest commit of each PR needs to finish its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nwb:
    # "locked" runs the pynwb version in uv.lock; "latest" upgrades to the
    # newest pynwb major (4 moved EventsTable into the NWB core schema) and
    # adds nwbinspector, so both majors and the best-practice checks are tested.
    name: NWB interop tests (pynwb ${{ matrix.pynwb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pynwb: ["locked", "latest"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies (with nwb extra)
        run: |
          uv sync --locked --extra nwb

      - name: Upgrade to the newest pynwb and add nwbinspector
        if: matrix.pynwb == 'latest'
        run: |
          uv pip install --upgrade "pynwb>=4" nwbinspector
          uv pip show pynwb hdmf ndx-events | grep -E "^(Name|Version)"

      - name: Run NWB interop tests
        run: |
          uv run --no-sync pytest tests/nwb \
            tests/ops/test_differential.py::test_operators_raise_without_finite_volume_geometry \
            tests/ops/test_basis.py::test_diffusion_bases_raise_without_finite_volume_geometry \
            -n 0 -q
        env:
          MPLBACKEND: Agg

      - name: Run NWB flagship docstrings
        run: uv run --no-sync pytest tests/docs/test_flagship_docstrings.py -m nwb -n 0
        env:
          MPLBACKEND: Agg
