name: Tests (xarray interop)

# Keep a focused xarray interop check alongside the full test matrix, which
# also installs the optional xarray extra.

on:
  push:
    branches:
      - main
  # Run checks for stacked PRs as well as PRs targeting main.
  pull_request:

permissions:
  contents: read

# Only the latest commit of each PR needs to finish its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xarray:
    name: xarray interop tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies (with xarray extra)
        run: |
          uv sync --locked --extra xarray

      - name: Run xarray interop tests
        run: |
          uv run pytest -n 0 \
            tests/encoding/test_spatial_xarray_interop.py \
            tests/encoding/test_directional_xarray_interop.py \
            tests/decoding/test_xarray_interop.py \
            tests/decoding/test_result.py \
            -q
        env:
          MPLBACKEND: Agg
