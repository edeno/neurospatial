name: Doc snippets

on:
  push:
    branches:
      - main
  # Run checks for stacked PRs as well as PRs targeting main.
  pull_request:

permissions:
  contents: read

# Only the latest commit of each PR needs to finish its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-doc-snippets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run on the lowest and highest supported Python so a snippet that
        # accidentally uses 3.11+-only syntax (e.g. PEP 695 type-parameters,
        # `Self`, structural unpacks) is caught before users on 3.10 hit it.
        # Intermediate versions are covered by tests.yml.
        python-version: ['3.10', '3.13']
    env:
      # Override the repository's .python-version so uv uses the interpreter
      # selected by this matrix rather than running both jobs on Python 3.13.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        # nwb + jax extras let the NWB/JAX docstring examples execute headlessly.
        # napari-backed modules need a display and are exercised by the
        # dedicated napari job in test.yml, so they are ignored below.
        # The executable widget example needs ipywidgets headlessly.
        run: |
          uv sync --locked --extra nwb --extra jax
          uv pip install "ipywidgets>=8.0,<9.0"

      - name: Report test interpreter
        run: uv run python --version

      - name: Run module doctests
        env:
          MPLBACKEND: Agg
        # ``-n0`` disables xdist (pyproject addopts set ``-n auto``).
        # ``--doctest-modules`` imports every module to collect doctests, so each
        # xdist worker holds a full copy of the library + JAX in memory; running
        # the heavy simulation-session example doctests across 4 such workers
        # exhausted the hosted runner's RAM and got the runner killed ("received
        # a shutdown signal"). Sequential doctests use a single import footprint
        # and finish in ~30s, well within budget.
        run: >-
          uv run pytest --doctest-modules src/neurospatial/ -n0
          --ignore=src/neurospatial/annotation/_assist_roi.py
          --ignore=src/neurospatial/annotation/_assist_widget.py
          --ignore=src/neurospatial/annotation/_outline_preview.py
          --ignore=src/neurospatial/annotation/_workflow.py
          --ignore=src/neurospatial/annotation/_napari_widget.py
          --ignore=src/neurospatial/annotation/_track_widget.py
          --ignore=src/neurospatial/animation/config.py
