name: Notebook collection

on:
  push:
    branches:
      - main
      - feat/researcher-first
  pull_request:
    branches:
      - main
      - feat/researcher-first

# Execute every tutorial in a fresh kernel. Optional desktop viewers and long
# video exports remain opt-in inside the notebooks; the synthetic video and NWB
# tutorials receive their required extras in the corresponding matrix groups.
jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            notebooks: examples/0[1-3]_*.ipynb examples/0[5-7]_*.ipynb
            extras: ''
          - group: real-data
            notebooks: examples/04_*.ipynb
            extras: ''
          - group: visualization
            notebooks: examples/08_*.ipynb
            extras: --extra video
          - group: nwb
            notebooks: examples/09_*.ipynb
            extras: --extra nwb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra notebooks ${{ matrix.extras }}

      - name: Check notebook sources, catalog and links
        run: uv run pytest tests/docs/test_notebook_collection.py -n 0

      - name: Cache the pinned public recording
        if: matrix.group == 'real-data'
        uses: actions/cache@v4
        with:
          path: data/j1620210710_02_r1_figure04_inputs.npz
          key: j16-60383b394b597e2900545548ecac7c53a8601038ace9dbeb42d7f9a5fe1c93b3

      - name: Execute ${{ matrix.group }} notebooks
        env:
          MPLBACKEND: Agg
        run: |
          uv run jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=600 \
            ${{ matrix.notebooks }}
