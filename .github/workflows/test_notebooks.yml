name: Notebook collection

on:
  push:
    branches:
      - main
  # Run checks for stacked PRs as well as PRs targeting main.
  pull_request:

# Execute every tutorial in a fresh kernel. Optional desktop viewers and long
# video exports remain opt-in inside the notebooks; the synthetic video and NWB
# tutorials receive their required extras in the corresponding matrix groups.
permissions:
  contents: read

# Only the latest commit of each PR needs to finish its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            notebooks: examples/0[1-3]_*.ipynb examples/0[5-7]_*.ipynb
            extras: ''
          - group: real-data
            notebooks: examples/04_*.ipynb
            extras: ''
          - group: visualization
            notebooks: examples/08_*.ipynb
            extras: --extra video
          - group: nwb
            notebooks: examples/09_*.ipynb
            extras: --extra nwb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        env:
          EXTRAS: ${{ matrix.extras }}
        run: uv sync --locked --group notebooks $EXTRAS

      - name: Check notebook sources, links and scientific boundaries
        run: >-
          uv run pytest
          tests/docs/test_notebook_collection.py
          tests/docs/test_notebook_boundaries.py
          tests/docs/test_decoder_plot_examples.py
          -n 0

      - name: Cache the pinned public recording
        if: matrix.group == 'real-data'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/j1620210710_02_r1_figure04_inputs.npz
          key: j16-60383b394b597e2900545548ecac7c53a8601038ace9dbeb42d7f9a5fe1c93b3

      - name: Execute ${{ matrix.group }} notebooks
        env:
          MPLBACKEND: Agg
          NOTEBOOKS: ${{ matrix.notebooks }}
        run: |
          uv run jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=600 \
            $NOTEBOOKS
